name: Test GHA Command

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify-toolchain-update:
    name: Verify released toolchain updater
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Read the published toolchain
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/saltyorg/sb-go/releases/latest --jq '.tag_name')
          gh release download "$release" --repo saltyorg/sb-go \
            --pattern sb_linux_amd64 --dir "$RUNNER_TEMP/published-sb"
          chmod 0755 "$RUNNER_TEMP/published-sb/sb_linux_amd64"
          version_json=$("$RUNNER_TEMP/published-sb/sb_linux_amd64" version --json)
          test "$(jq -r '.version' <<< "$version_json")" = "$release"
          uv_version=$(jq -er '.uv_version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$version_json")
          {
            echo "release=$release"
            echo "uv-version=$uv_version"
          } >> "$GITHUB_OUTPUT"

      - name: Create scoped updater token
        id: saltbox-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.SALTBOX_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.SALTBOX_AUTOMATION_PRIVATE_KEY }}
          owner: saltyorg
          repositories: Saltbox
          permission-contents: write

      - name: Preflight the updater without publishing
        uses: ./.github/actions/update-saltbox-python
        with:
          token: ${{ steps.saltbox-token.outputs.token }}
          sb-go-release: ${{ steps.published.outputs.release }}
          uv-version: ${{ steps.published.outputs.uv-version }}
          dry-run: 'true'

  test-gha:
    name: Test sb gha command
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout sb-go repository
        uses: actions/checkout@v7
        with:
          path: sb-go

      - name: Checkout Saltbox repository
        uses: actions/checkout@v7
        with:
          repository: saltyorg/Saltbox
          path: saltbox

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'sb-go/go.mod'
          cache-dependency-path: sb-go/go.sum

      - name: Tune GitHub-hosted runner network
        run: sudo ethtool -K eth0 tx off rx off

      - name: Create required directories
        run: sudo mkdir -p /srv/git

      - name: Set ownership
        run: sudo chown -R runner:runner /srv/git

      - name: Symlink Saltbox repository
        run: ln -s "$GITHUB_WORKSPACE/saltbox" /srv/git/saltbox

      - name: Run tidy
        working-directory: sb-go
        run: make tidy

      - name: Run tests
        working-directory: sb-go
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITHUB_COMMITTABLE_BRANCH_FIELDS=$(gh api graphql \
            -f query='query { __type(name: "CommittableBranch") { inputFields { name } } }' \
            --jq '[.data.__type.inputFields[].name]')
          export GITHUB_COMMITTABLE_BRANCH_FIELDS
          command -v tmux
          make test GO_TEST_FLAGS='-exec sudo'

      - name: Build sb binary
        working-directory: sb-go
        run: |
          make build
          sudo cp build/sb /usr/local/bin/sb
          /usr/local/bin/sb version

      - name: Print pip dependencies
        run: cat /srv/git/saltbox/requirements/requirements-saltbox.txt

      - name: Run sb gha command
        run: |
          set -x  # Enable command tracing
          /usr/local/bin/sb gha
          echo "Exit code: $?"

      - name: Verify installation
        run: |
          echo "=== Checking sb CLI ==="
          test -x /usr/local/bin/sb
          /usr/local/bin/sb version
          echo "=== Checking Python venv ==="
          ls -la /srv/ansible/venv/bin/
          /srv/ansible/venv/bin/python3 --version
          /srv/ansible/venv/bin/ansible --version
          echo "=== Checking private config ownership ==="
          test "$(stat -c '%U:%G:%a' /srv/git/saltbox/accounts.yml)" = "runner:runner:600"
          test "$(stat -c '%U:%G:%a' /srv/git/saltbox/settings.yml)" = "runner:runner:600"

      - name: Check saltbox.fact
        run: |
          echo "=== Checking saltbox.fact ==="
          ls -la /srv/git/saltbox/ansible_facts.d/saltbox.fact
          /srv/git/saltbox/ansible_facts.d/saltbox.fact

      - name: Test Ansible syntax check
        run: |
          cd /srv/git/saltbox
          /srv/ansible/venv/bin/ansible-playbook saltbox.yml --syntax-check
